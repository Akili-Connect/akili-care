name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Runtime is standard-library only; no dependency install needed.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo CLI smoke test
        run: |
          # A danger sign stops the flow and exits with code 1 on purpose.
          set +e
          PYTHONPATH=src python -m akili_care.cli --district Chipinge \
            --utterance "ndiri kurwadziwa pachipfuva"
          test $? -eq 1 || exit 1
          set -e
          PYTHONPATH=src python -m akili_care.cli --district Chipinge \
            --utterance "mwana ane musoro unorwadza"
